name: Probe
on:
  push:
    branches: [w858-probe]
jobs:
  cov:
    name: cov ${{ matrix.file }} #${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        file: [machineDeployWin, machines, orchestrators]
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          git config --global user.name "FF Factory CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: npm ci --no-audit --no-fund
      - shell: bash
        run: |
          node --test --experimental-test-coverage --test-coverage-exclude='**/*.test.ts' --test-coverage-exclude='e2e/**' --test-coverage-exclude='node_modules/**' server/${{ matrix.file }}.test.ts 2>&1 | tee out.txt
          code=${PIPESTATUS[0]}
          grep -E '^ℹ (tests|pass|fail) |Could not report' out.txt || true
          exit $code
