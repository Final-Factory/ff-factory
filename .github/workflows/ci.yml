name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Re-render every visual snapshot (Linux) and upload them as the "linux-snapshots" artifact
        type: boolean
        default: false

# A push to main runs only the secret scan and the identity check (w925, lothsahn: "3B"): its pull request already ran the
# whole suite, as FinalFactory's develop does. Each push to main is its own group, so a later merge never cancels them (68
# of 310 main commits lost their run that way, w922). The whole suite on main by hand: gh workflow run ci.yml --ref main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # The secret scan's, and the pre-push check's test (w924) in the checks job.
  GITLEAKS_VERSION: 8.30.1
  # Every unit-test run: a test that runs 5 min fails by name (none takes over 70 s; the few longer ones set their own
  # timeout), and scripts/test-watchdog.ts ends a run that outlives its deadline, naming the tests still running and the
  # processes under it. Before, a hung run was cancelled at the job's timeout with its whole log lost (w906).
  TEST_FLAGS: --test-timeout=300000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-inflight-reporter.ts --test-reporter-destination=stdout

# WHERE THESE JOBS RUN (w911, lothsahn 2026-10-10). The Linux jobs run on the FFBox build server's runner containers
# (label ffgithubrunners), not on GitHub-hosted runners: the hosted minutes were most of the organisation's Actions use.
# A container there has Node 24, npm, gitleaks and Playwright's browsers and their system libraries in its image,
# reaches only the npm registry from outside (never github.com or api.github.com), and gets this repository from
# the host's mirror: `ffghr-workspace.sh use-mirror` before actions/checkout. Actions are pinned by commit SHA because the
# image carries those archives and cannot download any other; there is no setup-node, no actions/cache and no sudo.
# What stays on a hosted runner needs root, systemd or Windows/macOS: the ops-socket job below, windows.yml,
# worker-update.yml, dev-drive.yml and vm-scripts.yml's lint and end-to-end jobs. rerun-lost-runner.yml runs on FFBox
# too (w1102): the host makes its API calls for it.
# The repository is public and the runners are shared with the private Final Factory repositories, so fork pull requests
# need an owner's approval before any of this runs (Settings, Actions, General) and these jobs hold no secret.

jobs:
  checks:
    # Not on a push to main (w925): see concurrency above.
    if: github.event_name != 'push'
    # Linux only: every unit test runs here. The few that also need Windows run in windows.yml, only when a pull request
    # touches what they cover (.github/windows-tests.txt; w910, lothsahn 2026-10-10). Until w910 the whole suite ran
    # again on two Windows runners for every pull request.
    name: Typecheck, unit tests, build (Linux)
    runs-on: ffgithubrunners
    timeout-minutes: 15
    steps:
      - name: The host's mirror of this repository at this commit
        run: /opt/ffghr/ffghr-workspace.sh use-mirror "${{ github.sha }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node, from the runner image
        run: node --version && test "$(node -p 'process.versions.node.split(".")[0]')" = "${{ env.NODE_VERSION }}"
      - name: A git identity for the tests that commit
        # Global config, not GIT_AUTHOR_* variables: some tests set a commit's identity with -c on purpose.
        run: |
          git config --global user.name "FF Factory CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Typecheck (server, shared, scripts, e2e)
        run: npm run typecheck
      - name: Typecheck (web)
        run: npm --prefix web run typecheck
      - name: gitleaks and shellcheck on the PATH, for the pre-push check's test (scripts/prepush.test.ts, w924)
        # Both are in the FFBox runner image (ffbox scripts/Dockerfile: GITLEAKS_VERSION, and shellcheck from the distribution);
        # a container cannot download gitleaks from github.com.
        run: |
          gitleaks version
          command -v shellcheck || { echo "::error::shellcheck is missing from the runner image (ffbox scripts/Dockerfile installs it)"; exit 1; }
      - name: Unit tests with coverage
        timeout-minutes: 11
        shell: bash
        run: |
          set -o pipefail
          # npm run test:coverage, with TEST_FLAGS: node takes options only before the files. PowerShell 7 (pwsh, on
          # the runner) runs the scripts' tests that need no Windows (server/testPowershell.ts).
          node scripts/test-watchdog.ts --minutes 10 -- node --test $TEST_FLAGS --experimental-test-coverage --test-coverage-exclude='**/*.test.ts' --test-coverage-exclude='e2e/**' --test-coverage-exclude='node_modules/**' server/*.test.ts scripts/*.test.ts 2>&1 | tee coverage.txt
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Unit tests'
            grep -E '^ℹ (tests|pass|fail|skipped) ' coverage.txt | sed 's/^ℹ /- /'
            echo
            echo '### Coverage (files the tests load)'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the web UI
        run: npm --prefix web run build

  ops-socket:
    name: The orchestration worker's socket under real systemd (w638)
    # HOSTED ON PURPOSE: it needs root and a running systemd (fff-ops.socket's own settings, the real launcher and the
    # portal's opsSpawner), and an FFBox runner container has neither. About two minutes a pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      # fff-ops.socket's settings, the real launcher and the portal's opsSpawner: a new process right after a stop runs.
      - name: fff-ops.socket under real systemd
        run: sudo --preserve-env=PATH deploy/vm/test/fff-ops-socket.test.sh

  e2e:
    # Not on a push to main (w925): see concurrency above.
    if: github.event_name != 'push'
    name: Playwright (Chromium + WebKit, ${{ matrix.shard }}/3)
    # The same tests, split across three runners by file (playwright test --shard); each starts its own servers.
    # The browsers are in the runner image, not downloaded: Chromium's build comes from storage.googleapis.com, which is every
    # Google Cloud bucket and cannot be fenced by name. They are the ones for ONE Playwright version (ffbox scripts/Dockerfile,
    # PLAYWRIGHT_VERSION); the first step below fails with that instruction when package-lock.json has moved on.
    runs-on: ffgithubrunners
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The shards' shares of the tests, in config order (Playwright's PWTEST_SHARD_WEIGHTS): the last holds the slow
      # WebKit projects, so it takes fewer. Each file goes to one shard whatever the weights, so none is ever left out.
      PWTEST_SHARD_WEIGHTS: '5:5:3'
    steps:
      - name: The host's mirror of this repository at this commit
        run: /opt/ffghr/ffghr-workspace.sh use-mirror "${{ github.sha }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - name: The browsers in the runner image are this Playwright's
        run: |
          want=$(node -p "require('@playwright/test/package.json').version")
          have=$(cat /opt/ms-playwright/PLAYWRIGHT_VERSION 2>/dev/null || echo none)
          if [ "$want" != "$have" ]; then
            echo "::error::package-lock.json has Playwright $want, the runner image has browsers for $have: bump PLAYWRIGHT_VERSION in ffbox scripts/Dockerfile (the host rebuilds the image on its next update), then re-run"
            exit 1
          fi
      - name: Build the web UI
        run: npm --prefix web run build
      - name: Snapshot mode
        id: snap
        shell: bash
        run: |
          # With no Linux baselines committed yet (or when asked), render them instead of comparing.
          if [ "${{ inputs.update_snapshots }}" = "true" ] || ! ls e2e/__screenshots__/*/*-linux.png >/dev/null 2>&1; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Rendering visual baselines instead of comparing them; commit the linux-snapshots artifact into e2e/__screenshots__/."
          fi
      - name: Run Playwright
        # Rendering baselines runs every test in the first shard alone, so its linux-snapshots artifact is whole.
        if: steps.snap.outputs.update != 'true' || matrix.shard == 1
        run: npx playwright test ${{ steps.snap.outputs.update == 'true' && '--update-snapshots=all' || format('--shard={0}/3', matrix.shard) }}
      - name: Performance budgets (web/perf/bench.ts, 7,000 stopped agents)
        # Render counts and DOM size per key typed, and layouts at rest, on the orchestrator and beside the sandbox
        # holding most past agents: counts, so a slow runner does not fail it. In one shard.
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: |
          node web/perf/bench.ts --check --live 0 --keys 60 --idle 5
          node web/perf/bench.ts --check --live 0 --keys 60 --idle 5 --route '#/sandbox/agent-mcp'
      # The artifacts go to the host, which uploads them on this job's own credential: a runner container cannot reach
      # the blob storage actions/upload-artifact writes to (.github/actions/ffghr-artifact-handoff).
      - name: Gather the report and traces
        if: failure()
        run: |
          mkdir -p pw-artifacts
          cp -R playwright-report test-results pw-artifacts/ 2>/dev/null || true
      - name: Upload the report and traces
        if: failure()
        uses: ./.github/actions/ffghr-artifact-handoff
        with:
          name: playwright-report-${{ matrix.shard }}
          path: pw-artifacts
      - name: Upload rendered snapshots
        if: always() && steps.snap.outputs.update == 'true' && matrix.shard == 1
        uses: ./.github/actions/ffghr-artifact-handoff
        with:
          name: linux-snapshots
          path: e2e/__screenshots__

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ffgithubrunners
    timeout-minutes: 5
    steps:
      - name: The host's mirror of this repository at this commit
        run: /opt/ffghr/ffghr-workspace.sh use-mirror "${{ github.sha }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks, from the runner image
        # 8.30.1 is baked into the image (ffbox scripts/Dockerfile, GITLEAKS_VERSION, checksum-verified at build): a
        # container cannot download it from github.com. A newer version here means bumping it there.
        run: gitleaks version
      - name: Scan the history of this commit
        # HEAD only: other branches on the remote are not what is being merged.
        run: gitleaks git . --log-opts=HEAD --redact --no-banner --verbose
      - name: Scan the working tree
        run: gitleaks dir . --redact --no-banner

  identity:
    name: Commit identities are noreply
    runs-on: ffgithubrunners
    timeout-minutes: 5
    steps:
      - name: The host's mirror of this repository at this commit
        run: /opt/ffghr/ffghr-workspace.sh use-mirror "${{ github.sha }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check the new commits
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          elif [ "$EVENT" = workflow_dispatch ]; then
            # A manual run checks what this branch adds to main. Main's own commits were checked when they were pushed, and
            # 11 of 2026-10-05/06 that are public for good would fail every manual run (w922: 16 such failures in 14 days).
            range="origin/main..$AFTER"
          else
            # A rewritten history: check everything reachable.
            range="$AFTER"
          fi
          node scripts/check-identity.ts "$range"
