name: CI

# w521 measurement branch only (never merged): the unit tests several ways on one runner each.
on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: unused here
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  variants:
    name: Unit test variants (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: |
          git config --global user.name "FF Factory CI"
          git config --global user.email "ci@users.noreply.github.com"
        shell: bash
      - run: npm ci --no-audit --no-fund
      - name: A, as CI runs it (coverage, default concurrency)
        shell: bash
        run: |
          s=$(date +%s); npm run test:coverage > a.txt 2>&1 || echo "A FAILED"; echo "A wall $(( $(date +%s) - s )) s"; grep -E '^ℹ (tests|pass|fail|duration_ms)' a.txt
      - name: B, no coverage (default concurrency)
        shell: bash
        run: |
          s=$(date +%s); npm test > b.txt 2>&1 || echo "B FAILED"; echo "B wall $(( $(date +%s) - s )) s"; grep -E '^ℹ (tests|pass|fail|duration_ms)' b.txt
      - name: C, coverage, --test-concurrency=6
        shell: bash
        run: |
          s=$(date +%s); node --test --test-concurrency=6 --experimental-test-coverage --test-coverage-exclude='**/*.test.ts' --test-coverage-exclude='e2e/**' --test-coverage-exclude='node_modules/**' server/*.test.ts scripts/*.test.ts > c.txt 2>&1 || echo "C FAILED"; echo "C wall $(( $(date +%s) - s )) s"; grep -E '^ℹ (tests|pass|fail|duration_ms)' c.txt; grep -E '^✖' c.txt | head -5
      - name: D, coverage, --test-concurrency=8
        shell: bash
        run: |
          s=$(date +%s); node --test --test-concurrency=8 --experimental-test-coverage --test-coverage-exclude='**/*.test.ts' --test-coverage-exclude='e2e/**' --test-coverage-exclude='node_modules/**' server/*.test.ts scripts/*.test.ts > d.txt 2>&1 || echo "D FAILED"; echo "D wall $(( $(date +%s) - s )) s"; grep -E '^ℹ (tests|pass|fail|duration_ms)' d.txt; grep -E '^✖' d.txt | head -5
