name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Re-render every visual snapshot (Linux) and upload them as the "linux-snapshots" artifact
        type: boolean
        default: false

# A push to main runs only the secret scan and the identity check (w925, lothsahn: "3B"): its pull request already ran the
# whole suite, as FinalFactory's develop does. Each push to main is its own group, so a later merge never cancels them (68
# of 310 main commits lost their run that way, w922). The whole suite on main by hand: gh workflow run ci.yml --ref main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # The secret scan's, and the pre-push check's test (w924) in the checks job.
  GITLEAKS_VERSION: 8.30.1
  # Every unit-test run: a test that runs 5 min fails by name (none takes over 70 s; the few longer ones set their own
  # timeout), and scripts/test-watchdog.ts ends a run that outlives its deadline, naming the tests still running and the
  # processes under it. Before, a hung run was cancelled at the job's timeout with its whole log lost (w906).
  TEST_FLAGS: --test-timeout=300000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-inflight-reporter.ts --test-reporter-destination=stdout

# WHERE THESE JOBS RUN (w1194, lothsahn 2026-10-13: "I'd like to move the ff-factory CI processes off githubrunner and
# back to hosted githubrunner processes"). Every job runs on GitHub's hosted runners, which cost this public repository
# nothing (docs/ci-placement.md). The FFBox build server's runners (ffgithubrunners) serve the game repository only.
# Fork pull requests run here like any other (pull_request, never pull_request_target): GitHub gives them a read-only
# GITHUB_TOKEN and no secrets, these jobs use none, and a first-time contributor's run waits for an owner's approval
# (Settings, Actions, General).
jobs:
  checks:
    # Not on a push to main (w925): see concurrency above.
    if: github.event_name != 'push'
    # Linux only: every unit test runs here. The few that also need Windows run in windows.yml, only when a pull request
    # touches what they cover (.github/windows-tests.txt; w910, lothsahn 2026-10-10). Until w910 the whole suite ran
    # again on two Windows runners for every pull request.
    name: Typecheck, unit tests, build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The pre-push check's test (w924) runs gitleaks; shellcheck comes with the runner image.
      - uses: ./.github/actions/gitleaks
        with:
          version: ${{ env.GITLEAKS_VERSION }}
      - name: A git identity for the tests that commit
        # Global config, not GIT_AUTHOR_* variables: some tests set a commit's identity with -c on purpose.
        run: |
          git config --global user.name "FF Factory CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Typecheck (server, shared, scripts, e2e)
        run: npm run typecheck
      - name: Typecheck (web)
        run: npm --prefix web run typecheck
      - name: Unit tests with coverage
        timeout-minutes: 11
        shell: bash
        run: |
          set -o pipefail
          # npm run test:coverage, with TEST_FLAGS: node takes options only before the files. PowerShell 7 (pwsh, on
          # the runner) runs the scripts' tests that need no Windows (server/testPowershell.ts).
          node scripts/test-watchdog.ts --minutes 10 -- node --test $TEST_FLAGS --experimental-test-coverage --test-coverage-exclude='**/*.test.ts' --test-coverage-exclude='e2e/**' --test-coverage-exclude='node_modules/**' server/*.test.ts scripts/*.test.ts 2>&1 | tee coverage.txt
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Unit tests'
            grep -E '^ℹ (tests|pass|fail|skipped) ' coverage.txt | sed 's/^ℹ /- /'
            echo
            echo '### Coverage (files the tests load)'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the web UI
        run: npm --prefix web run build

  e2e:
    # Not on a push to main (w925): see concurrency above.
    if: github.event_name != 'push'
    name: Playwright (${{ matrix.engine }})
    # One job per browser engine (w1191), each running its own projects (E2E_PROJECTS), starting only their servers and
    # installing only its browser. Playwright starts every webServer in the config whatever a job runs, so each of the
    # three --shard jobs before booted all nine servers (about 32 s a job, measured on FFBox) and installed both browsers
    # with their system libraries; and every job counts against the organisation's 20 hosted jobs at once
    # (docs/ci-placement.md). scripts/e2e-legs.test.ts fails a project left out of both legs, or in both.
    # The Linux screenshot baselines match ubuntu-latest's fonts: re-render them with the update_snapshots input when they
    # stop matching (docs/ci-placement.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test time per leg, summed from run 38333790206's three shards: Chromium about 486 s (645 before mobile-chrome ran
          # only the phone specs, playwright.config.ts ANDROID), WebKit about 574 s.
          # ipad-chrome is in the WebKit leg: it is the iPad device with Chrome's user agent, so its engine is WebKit.
          - engine: Chromium
            browser: chromium
            projects: desktop-chromium,mobile-chrome,provider-desktop,provider-mobile,intake-desktop
          - engine: WebKit
            browser: webkit
            projects: mobile-safari,ipad-safari,ipad-chrome,intake-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Does this change reach the end-to-end tests
        # A pull request that changes only words or what these tests never load skips them (w1191): docs/, changelog.d/, a
        # top-level *.md, deploy/ (the VM scripts, tested in vm-scripts.yml) and .github/ other than this file. Neither
        # server/, machine/, shared/, web/ nor e2e/ reads any of them at run time (grep, 2026-10-13); unit tests do, so the
        # checks job always runs. A pull request's merge commit has the base as its first parent: HEAD^1..HEAD is its change.
        id: need
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only HEAD^1 HEAD)
          rest=$(grep -vE '^(docs/|changelog\.d/|deploy/|\.github/)|^[^/]+\.md$' <<<"$files" || true)
          ci=$(grep -xF '.github/workflows/ci.yml' <<<"$files" || true)
          if [ -z "$rest" ] && [ -z "$ci" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No end-to-end tests: this change touches only docs, changelog notes, deploy/ or .github/."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.need.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - if: steps.need.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.need.outputs.run == 'true'
        run: npm ci --prefix web --no-audit --no-fund
      - name: Snapshot mode
        if: steps.need.outputs.run == 'true'
        id: snap
        shell: bash
        run: |
          # With no Linux baselines committed yet (or when asked), render them instead of comparing.
          if [ "${{ inputs.update_snapshots }}" = "true" ] || ! ls e2e/__screenshots__/*/*-linux.png >/dev/null 2>&1; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Rendering visual baselines instead of comparing them; commit the linux-snapshots artifact into e2e/__screenshots__/."
          fi
      - name: This job's browser and its system libraries (both when rendering baselines)
        if: steps.need.outputs.run == 'true'
        run: npx playwright install --with-deps ${{ steps.snap.outputs.update == 'true' && 'chromium webkit' || matrix.browser }}
      - name: Build the web UI
        if: steps.need.outputs.run == 'true'
        run: npm --prefix web run build
      - name: Run Playwright
        # Rendering baselines runs every project in the Chromium leg alone (E2E_PROJECTS empty: all of them, with both
        # browsers installed above), so its linux-snapshots artifact is whole.
        if: steps.need.outputs.run == 'true' && (steps.snap.outputs.update != 'true' || matrix.engine == 'Chromium')
        env:
          E2E_PROJECTS: ${{ steps.snap.outputs.update != 'true' && matrix.projects || '' }}
        run: npx playwright test ${{ steps.snap.outputs.update == 'true' && '--update-snapshots=all' || '' }}
      # No performance budgets here (web/perf/bench.ts): CI runs no perf, load or timing tests (lothsahn, 2026-10-12, w1173:
      # "We don't want load or performance tests in the ff factory CI pipeline"). Agents run `npm run perf` locally
      # (CONTRIBUTING.md, "Performance").
      - name: Gather the report and traces
        if: failure()
        run: |
          mkdir -p pw-artifacts
          cp -R playwright-report test-results pw-artifacts/ 2>/dev/null || true
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.engine }}
          path: pw-artifacts
      - name: Upload rendered snapshots
        if: always() && steps.snap.outputs.update == 'true' && matrix.engine == 'Chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-snapshots
          path: e2e/__screenshots__

  hygiene:
    # One job for both, on pull requests and on a push to main (w925): each was 10 to 20 seconds of work in a runner of its
    # own, and every job counts against the organisation's 20 hosted jobs at once (w1191). Each check runs even when the
    # one before it failed, so every one answers.
    name: Secret scan and commit identities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (downloaded and checksum-verified)
        uses: ./.github/actions/gitleaks
        with:
          version: ${{ env.GITLEAKS_VERSION }}
      - name: Scan the history of this commit
        # HEAD only: other branches on the remote are not what is being merged.
        run: gitleaks git . --log-opts=HEAD --redact --no-banner --verbose
      - name: Scan the working tree
        if: ${{ !cancelled() }}
        run: gitleaks dir . --redact --no-banner
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Commit identities are noreply (the new commits)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          elif [ "$EVENT" = workflow_dispatch ]; then
            # A manual run checks what this branch adds to main. Main's own commits were checked when they were pushed, and
            # 11 of 2026-10-05/06 that are public for good would fail every manual run (w922: 16 such failures in 14 days).
            range="origin/main..$AFTER"
          else
            # A rewritten history: check everything reachable.
            range="$AFTER"
          fi
          node scripts/check-identity.ts "$range"
