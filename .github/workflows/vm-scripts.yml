name: Portal VM scripts

# deploy/vm: the FF Factory portal's VM on the FFBox host (docs/portal-on-ffbox-host.md). Lint on every change to
# them; the end-to-end job builds the real thing on a throwaway runner: libvirt, the isolated network and firewall,
# a VM from the Ubuntu cloud image, the guest install, updates, rollback, health restarts, the nightly cycle, hang
# detection, the watchdog and the uninstall. Weekly as well, since it depends on outside sources (the cloud image,
# NodeSource, GitHub CLI and Tailscale repositories).
on:
  pull_request:
    branches: [main]
    paths: ['deploy/vm/**', 'server/restart.ts', 'server/agents.ts', '.github/workflows/vm-scripts.yml']
  push:
    branches: [main]
    paths: ['deploy/vm/**', 'server/restart.ts', 'server/agents.ts', '.github/workflows/vm-scripts.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: vm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shellcheck, units, dry runs)
    # The guest's release (decision D14: 26.04), so the guest install's dry run meets its packages.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck nftables
      - name: Host install --dry-run changes nothing
        run: |
          printf 'VM_DISK_MODE=qcow2\n' | sudo tee /tmp/fff-vm.conf
          sudo deploy/vm/host/install.sh --dry-run --config /tmp/fff-vm.conf
          test ! -e /etc/fff-vm && test ! -e /var/lib/fff-vm/manifest && test ! -e /usr/local/sbin/fff-vm
          ! sudo nft list table inet fff_vm 2>/dev/null
          ! dpkg -l libvirt-daemon-system 2>/dev/null | grep -q '^ii'
      - name: Guest install --dry-run changes nothing
        run: |
          sudo deploy/vm/guest/install.sh --dry-run
          test ! -e /srv/fff && ! id fff 2>/dev/null && test ! -e /etc/apt/sources.list.d/nodesource.list
      # After the dry runs: --units installs the scripts and an fff account so systemd-analyze can check the units.
      - name: shellcheck, bash -n, modes, JSON, PowerShell parse, systemd-analyze verify
        run: |
          [ -e /usr/bin/node ] || sudo ln -s "$(command -v node)" /usr/bin/node
          sudo deploy/vm/test/lint.sh --units

  e2e:
    name: End to end, a 26.04 guest in a nested VM (${{ matrix.disk }} on an ${{ matrix.host }} host)
    needs: lint
    # The guest is always the default release (26.04, D14). The FFBox host's release is not known here, so the host
    # side runs on both LTS releases, with the zvol (D13) on both.
    runs-on: ${{ matrix.host }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { disk: zvol, host: ubuntu-24.04 }
          - { disk: zvol, host: ubuntu-26.04 }
          - { disk: qcow2, host: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: KVM for this runner
        # GitHub's documented rule for hardware acceleration on its Linux runners.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          grep -Ec 'vmx|svm' /proc/cpuinfo
      - name: Run
        run: sudo --preserve-env=CI deploy/vm/test/ci-vm-e2e.sh ${{ matrix.disk }}
      - name: Logs
        if: failure()
        run: |
          mkdir -p vm-logs
          sudo cp /var/log/libvirt/qemu/*.log vm-logs/ 2>/dev/null || true
          sudo journalctl --no-pager -u 'fff-vm-*' -u libvirtd > vm-logs/host-journal.txt 2>&1 || true
          sudo /usr/local/sbin/fff-vm ssh 'sudo journalctl --no-pager -b -u "fff-*" -u cloud-init -u qemu-guest-agent' > vm-logs/guest-journal.txt 2>&1 || true
          sudo nft list ruleset > vm-logs/nft-ruleset.txt 2>&1 || true
          sudo chmod -R a+r vm-logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vm-logs-${{ matrix.disk }}-${{ matrix.host }}
          path: vm-logs/
          retention-days: 14
