name: Worker update end to end

# w613: the worker update (scripts/worker/worker.ts update, install.sh --update, install.ps1 -Update) on a real
# Windows and a real Mac, against the throwaway portal (scripts/worker/test/update-e2e.ts): no terminal and stdin
# closed as over ssh, elevated on Windows (GitHub's Windows runner is), no game-repo fetch, every setting, the
# credential and a Mac's PATH carried, the daemon restarted and seen online. docs/worker-install.md, "Updating".
# w1596: then the updates over the daemon's own link (scripts/worker/test/link-e2e.ts): an update to the portal's commit, one
# whose daemon never comes back and is put back by the job itself, a restart and an unload, all with no ssh.
# On pull requests and by hand only; never on a push to main, whose pull request ran it (w925).

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/worker/**'
      - 'machine/**'
      - 'server/leftovers.test.ts'
      - 'server/machineDeploy.ts'
      - 'server/machineDeployWin.ts'
      - 'server/machines.ts'
      - 'server/machineProtocol.ts'
      - 'server/machineLink.ts'
      - 'shared/types.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker-update.yml'
  workflow_dispatch:

concurrency:
  group: worker-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Worker update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    # A clean machine per run: it installs and updates a worker under the OS's service manager.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w1596: the throwaway portal sends its code as a git bundle, which a shallow clone cannot make.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: A git identity (the test's game repo commits)
        run: |
          git config --global user.name "FF Factory CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: npm ci --no-audit --no-fund
      # w1197: the leftover reaper's macOS path on a real Mac: other processes' environments read with `ps -E`, a stopped
      # session's "player" and "Xvfb" ended, a live one's kept, ff-leftovers through its shim. No other job runs unit tests
      # on a Mac, and the m5's daemon runs this same code as its user, as this runner does.
      - name: The leftover reaper on a real Mac
        if: runner.os == 'macOS'
        run: node --test --test-timeout=300000 server/leftovers.test.ts
      - name: Install a test root, tune it, update it as over ssh, and check what the update promises
        run: node scripts/worker/test/update-e2e.ts "${{ runner.temp }}/w613-update" 8797
      - name: The test daemon's log
        if: always()
        shell: bash
        run: cat "${{ runner.temp }}/w613-update/root/daemon/logs/daemon.log" 2>/dev/null | tail -n 80 || true
      - name: Update, roll back, restart and unload a test root over its daemon's link, with no ssh (w1596)
        run: node scripts/worker/test/link-e2e.ts "${{ runner.temp }}/w1596-link" 8795
      - name: The link test's daemon and job logs
        if: always()
        shell: bash
        run: |
          for f in daemon.log daemon.err.log supervisor.log update-job.log; do echo "== $f"; tail -n 60 "${{ runner.temp }}/w1596-link/root/daemon/logs/$f" 2>/dev/null || true; done
