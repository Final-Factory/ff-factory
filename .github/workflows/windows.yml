name: Windows tests

# The unit tests that need Windows, and only those (w910, lothsahn 2026-10-10: "we only run windows and mac specific tests
# on those runners when needed. And if we have a valid linux test, don't run that test on windows and mac unless there's
# a specific reason to test windows-specific differences"). Which files and why: .github/windows-tests.txt. Every test
# also runs on Linux in ci.yml. This runs only when a pull request touches one of those tests or the code they cover on
# Windows (the paths below, checked against the list by scripts/windows-tests.test.ts), and once a day with every test
# (the schedule below), never on a push to main (w925: the pull request ran it). main has no required checks, so a run that
# never starts blocks nothing.
#
# Before w910 the whole suite ran here in two shards on every pull request; w906 found why shard 1/2 flaked: an empty
# coverage file (a node ended mid-write by PowerShell; this job collects no coverage, Linux does) and runners GitHub lost
# mid-job (actions/runner#4632; rerun-lost-runner.yml re-runs those once).

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.ps1'
      - 'machine/**'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/instance-priority.test.ts'
      - 'scripts/instance/new.ts'
      - 'scripts/join.test.ts'
      - 'scripts/test-inflight-reporter.ts'
      - 'scripts/test-watchdog.test.ts'
      - 'scripts/test-watchdog.ts'
      - 'scripts/updatePath.test.ts'
      - 'server/agentTools.test.ts'
      - 'scripts/worker/join.cmd'
      - 'server/cleanup.test.ts'
      - 'server/cleanup.ts'
      - 'server/agentTools.ts'
      - 'server/copyTree.test.ts'
      - 'server/elevation.test.ts'
      - 'server/elevation.ts'
      - 'server/firefox.test.ts'
      - 'server/hostWatch.test.ts'
      - 'server/junctionDelete.test.ts'
      - 'server/leftovers.test.ts'
      - 'server/machineDeploy.ts'
      - 'server/machineDeployWin.test.ts'
      - 'server/machineDeployWin.ts'
      - 'server/machineDialogs.test.ts'
      - 'server/machineJoinHttp.ts'
      - 'server/machineSandboxesEditors.test.ts'
      - 'server/machineSandboxesLife.test.ts'
      - 'server/machineSandboxesTestKit.ts'
      - 'server/machineSandboxesTrim.test.ts'
      - 'server/machineUnityMcp.test.ts'
      - 'server/opsWorker.test.ts'
      - 'server/opsWorker.ts'
      - 'server/orchestratorMemory.test.ts'
      - 'server/orchestratorMemory.ts'
      - 'server/ownLeftovers.test.ts'
      - 'server/ownLeftovers.ts'
      - 'server/proc.ts'
      - 'server/republish.test.ts'
      - 'server/safeGit.ts'
      - 'server/sandboxes.test.ts'
      - 'server/sandboxes.ts'
      - 'server/toolsLabelsWin.test.ts'
      - 'server/agentNode.test.ts'
      - 'server/agentNode.ts'
      - 'server/storeLock.test.ts'
      - 'server/gitHooks/**'
      - 'server/testPowershell.ts'
      - 'server/transcriptLabels.test.ts'
      - 'server/transcriptLabels.ts'
      - 'server/unityReaper.test.ts'
      - 'server/updateSteps.test.ts'
      - 'server/watchdog.ts'
      - 'server/workerCaps.test.ts'
      - 'server/workerFence.test.ts'
      - 'server/workerFence.ts'
      - 'machine/readFence.ts'
      - 'server/w5564PlayerFence.test.ts'
      - 'server/w5630MacEditorFence.test.ts'
      - '.github/windows-tests.txt'
      - '.github/workflows/windows.yml'
  # The safety net: the whole suite on Windows once a day, for what no list names. In the 30 days to 2026-10-10 the
  # Windows runs caught 2 real bugs Linux missed, both before merge: a path rule in server/cleanup.ts (now listed) and a
  # timing one in server/machines.ts (a slow fsync on Windows held a handshake back: 3d56a5b) that only the whole
  # suite would have met. About 80 other Windows-only failures were flakes or test fixes (w910).
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: Every test file, as the daily run does
        type: boolean
        default: false

concurrency:
  # The daily or a dispatched whole-suite run in a group of its own, so it never cancels a push's run on main.
  group: windows-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || inputs.all) && 'all' || 'listed' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    # The whole suite in four shards, each on its own runner (w5810). On one runner it took 14.5-14.8 min of its 15 min
    # watchdog on its last green days (2026-11-19, 2026-11-20) and outlived it on 27 of the 30 days to 2026-11-25, on a
    # suite that grew from 339 to 499 files in a month; Linux split the same suite in two for the same reason (w5679).
    name: Windows tests${{ (github.event_name == 'schedule' || inputs.all) && format(' (the whole suite, {0}/4)', matrix.shard) || '' }}
    runs-on: windows-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || inputs.all) && '[1, 2, 3, 4]' || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: A git identity for the tests that commit
        run: |
          git config --global user.name "FF Factory CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: npm ci --no-audit --no-fund
      # A few tests load the web's code (server/swClick.test.ts, server/vault.test.ts, scripts/release.test.ts), as on Linux.
      - if: github.event_name == 'schedule' || inputs.all
        run: npm ci --prefix web --no-audit --no-fund
      - name: The tests that need Windows (.github/windows-tests.txt), or every test once a day
        # The listed files take about 2 min; a quarter of the whole suite about 4 (w5810).
        timeout-minutes: 17
        shell: bash
        env:
          ALL: ${{ github.event_name == 'schedule' || inputs.all }}
          FF_TEST_FILE_TIMES: ${{ runner.temp }}/file-times.json
        run: |
          shard=()
          if [ "$ALL" = true ]; then
            files=(server/*.test.ts scripts/*.test.ts scripts/worker/*.test.ts machine/*.test.ts)
            shard=(--test-shard=${{ matrix.shard }}/4)
          else
            mapfile -t files < <(grep -vE '^\s*(#|$)' .github/windows-tests.txt | cut -d'|' -f1 | tr -d ' ')
          fi
          echo "${#files[@]} test files ${shard[*]}"
          node scripts/test-watchdog.ts --minutes $([ "$ALL" = true ] && echo 15 || echo 9) -- node --test --test-timeout=300000 "${shard[@]}" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-inflight-reporter.ts --test-reporter-destination=stdout --test-reporter=./scripts/test-file-times.ts --test-reporter-destination=stdout "${files[@]}"
      - name: Test files' time (the slowest, and a file whose process outlives its tests)
        if: always() && (github.event_name == 'schedule' || inputs.all)
        shell: bash
        run: |
          rc=0
          node scripts/test-file-times.ts --check "$RUNNER_TEMP/file-times.json" > file-times.txt || rc=$?
          cat file-times.txt
          { echo '### Test files, shard ${{ matrix.shard }}/4'; echo '```'; cat file-times.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
