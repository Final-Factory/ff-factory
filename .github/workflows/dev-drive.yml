name: Worker Dev Drive end to end

# w900: the worker install's Dev Drive (scripts/worker/devdrive.ps1, scripts/privileged/ffsb-helper.ps1 and devdrive-lib.ps1,
# scripts/install-privileged-helpers.ps1) on a real Windows: a real VHDX is made, formatted ReFS, mounted at the first free
# letter from V: down, re-run (idempotent), detached and brought back by the boot task at the same letter, then again with its
# letter taken. GitHub's Windows runner is elevated and has the virtual disk service.
# docs/worker-install.md, "The Dev Drive".
# On pull requests and by hand only; never on a push to main, whose pull request ran it (w925).

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/worker/devdrive.ps1'
      - 'scripts/worker/devdrive.ts'
      - 'scripts/worker/test/devdrive-e2e.ts'
      - 'scripts/privileged/**'
      - 'scripts/install-privileged-helpers.ps1'
      - '.github/workflows/dev-drive.yml'
  workflow_dispatch:

concurrency:
  group: dev-drive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dev-drive:
    name: Dev Drive (windows-latest)
    runs-on: ${{ vars.FF_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 30
    steps:
      - uses: Final-Factory/ci-actions/checkout@c5584f1c8b3f62823efd7a74d88019c2d1f40565
      - uses: Final-Factory/ci-actions/setup@c5584f1c8b3f62823efd7a74d88019c2d1f40565
        with:
          node: '24'
      - name: The VHDX, its letter, a re-run, a reboot and a taken letter
        run: node scripts/worker/test/devdrive-e2e.ts "${{ runner.temp }}\w900-devdrive"
