name: gitleaks
description: >
  gitleaks at the version asked for, on the PATH of a GitHub-hosted Linux runner: the release tarball, checked against
  the release's own checksums file before it is unpacked. When that one file cannot be fetched (GitHub served it 504
  for hours on 2026-11-08 while the tarball downloaded, w3597), the asset's sha256 digest from GitHub's releases API
  stands in for it.
inputs:
  version:
    description: gitleaks version, e.g. '8.30.1'.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WANT: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in X64) arch=x64 ;; ARM64) arch=arm64 ;; *) echo "::error::no gitleaks build for $RUNNER_ARCH"; exit 1 ;; esac
        file="gitleaks_${WANT}_linux_${arch}.tar.gz"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${WANT}"
        dir="$RUNNER_TEMP/gitleaks-$WANT"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/$file" "$base/$file"
        if curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/gitleaks_${WANT}_checksums.txt"; then
          expected=$(awk -v f="$file" '$2 == f { print $1 }' "$dir/checksums.txt")
          [ -n "$expected" ] || { echo "::error::$file is not in the release's checksums file"; exit 1; }
        else
          echo "::warning::the release's checksums file could not be fetched; checking $file against its API digest"
          digest=$(gh api "repos/gitleaks/gitleaks/releases/tags/v${WANT}" --jq ".assets[] | select(.name == \"$file\") | .digest")
          case "$digest" in sha256:*) expected="${digest#sha256:}" ;; *) echo "::error::no sha256 digest for $file (got '$digest')"; exit 1 ;; esac
        fi
        actual=$(sha256sum "$dir/$file" | cut -d' ' -f1)
        [ "$actual" = "$expected" ] || { echo "::error::$file does not match its checksum ($actual, want $expected)"; exit 1; }
        tar -xzf "$dir/$file" -C "$dir" gitleaks
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/gitleaks" version
