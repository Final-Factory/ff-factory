# Installed by deploy/vm/guest/install.sh as /etc/systemd/system/tailscaled.service.d/10-fff-restart.conf (w698). Tailscale's
# own unit restarts the daemon when it fails (Restart=on-failure) but gives up after 5 starts in 10 seconds; the portal is
# unreachable from outside without it. This tries again every 5 s, 10 times in 10 minutes; after that fff-health (every
# 30 s) takes over, with a back-off, and gives up for good after WATCHDOG_MAX_ATTEMPTS restarts that did not hold.
[Unit]
StartLimitIntervalSec=10min
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=5s
