# Drop-in for fff-portal.service (install.sh writes it as fff-portal.service.d/20-journal.conf, only where the group
# exists): the server reads its own journal for the portal_logs tool (w920, docs/portal-logs.md) and reads nothing else
# with it. The group lets journalctl open the system journal for the server's account alone while it runs: no shell
# login of that account has it, and every line is redacted by the server before a worker sees it.
[Service]
SupplementaryGroups=systemd-journal
